<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Viewer · Building…</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0e1117;
      color: #e6e6e6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    h1 { color: #4fc3f7; font-size: 2rem; margin-bottom: 1rem; }
    p { color: #9aa4b2; max-width: 560px; line-height: 1.6; }
    a { color: #4fc3f7; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #2c3645;
      border-top-color: #4fc3f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 1.5rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <h1>📈 Stock Viewer</h1>
    <div class="spinner"></div>
    <p>
      First build is running in GitHub Actions. Once it finishes, this page
      will automatically show candlestick charts, stats and news for AAPL,
      MSFT, GOOGL, AMZN, NVDA, META and TSLA.
    </p>
    <p style="margin-top: 1.5rem;">
      Inspired by <a href="https://github.com/OpenBB-finance/OpenBB">OpenBB</a>

    </p>
  </div>
