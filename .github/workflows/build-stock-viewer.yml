name: Build Stock Viewer

on:
  push:
    branches:
      - main
      - claude/explore-openbb-finance-NJyfE
    paths:
      - "openbb-stock-viewer/build.py"
      - ".github/workflows/build-stock-viewer.yml"
  schedule:
    # Every weekday at 22:30 UTC — shortly after US market close
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-stock-viewer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance plotly pandas jinja2

      - name: Build static HTML
        working-directory: openbb-stock-viewer
        run: python build.py

      - name: Commit updated index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet openbb-stock-viewer/index.html; then
            echo "No changes to commit."
          else
            git add openbb-stock-viewer/index.html
            git commit -m "chore(stocks): refresh stock viewer data [skip ci]"
            git push
          fi
